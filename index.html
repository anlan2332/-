        .sider-menu {

        }

        .content-layout {

            align-items: center;
        }
        .header-title {

            font-weight: 600;
            color: #333;
        }
        .header-actions .ant-btn {
            margin-left: 16px;
        }
        .main-content {
            flex-grow: 1;
            background-color: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
        }
        .form-section {
            flex: 2;
            padding-right: 24px;
            border-right: 1px solid #f0f0f0;
        }
        .form-section .ant-form-item {
            margin-bottom: 16px;
        }
        .form-section .ant-input-group-wrapper .ant-input-affix-wrapper {

        }
        .info-section .ant-card-body {
            padding-top: 0;
        }
        .info-section .ant-list-item {
            padding: 8px 0;
        }
        .chat-section {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 300px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }
        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        .chat-body {
            padding: 16px;
            max-height: 300px;
            overflow-y: auto;
        }
        .chat-input .ant-input-affix-wrapper {
            border-radius: 8px;
        }
